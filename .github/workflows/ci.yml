name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Lint, model tests, RTL simulation
        run: make test
      - name: Double-bit error run
        run: make sim FLIP=2 PACKETS=5000
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Plant bugs and check the testbench catches each one
        run: scripts/mutation_test.sh
